name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: ${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/uv.lock') != '' && 'pip' || '' }}
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            **/uv.lock
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          while IFS= read -r f; do pip install -r "$f" || true; done < <(find . -maxdepth 3 -name 'requirements*.txt' -not -path './.venv/*' | head -8)
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e . || true; fi
          pip install pytest
      - name: Required files
        run: |
          test -f README.md
          test -f LICENSE || test -f LICENSE.md
      - name: Pytest (tests/ only, hard)
        run: |
          set -e
          if [ -d tests ]; then python -m pytest -q tests
          elif [ -d Test ]; then python -m pytest -q Test
          else echo "No tests/ — structure OK"; fi

          if [ -d analysis_service/tests ]; then
            pip install -r analysis_service/requirements.txt 2>/dev/null || true
            python -m pytest -q analysis_service/tests || true
          fi


  readme-audit:
    name: README links & SVG audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit local image and link targets
        run: |
          set -e
          rc=0
          for f in README.md README.zh-CN.md; do
            [ -f "$f" ] || { echo "missing $f"; rc=1; continue; }
            # local targets inside markdown image syntax and <img src=...>
            grep -oE '!\[[^]]*]\(([^) #]+)(?: [^)]*)?\)' "$f" \
              | sed -E 's/.*\(([^) #]+).*/\1/' \
              | grep -vE '^(https?:|data:|#)' | sort -u | while read -r img; do
                [ -f "$img" ] || { echo "$f: missing image $img"; rc=1; }
              done
            grep -oE 'src="([^"]+)"' "$f" \
              | sed -E 's/src="([^"]+)"/\1/' \
              | grep -vE '^(https?:|data:|#)' | sort -u | while read -r img; do
                [ -f "$img" ] || { echo "$f: missing img src $img"; rc=1; }
              done
          done
          # SVG basics: every *.svg must have viewBox + <title>, no <script> / foreignObject
          while IFS= read -r -d '' svg; do
            grep -q 'viewBox'    "$svg" || { echo "$svg: missing viewBox";    rc=1; }
            grep -q '<title'     "$svg" || { echo "$svg: missing <title>";   rc=1; }
            grep -qE '<script|foreignObject' "$svg" \
              && { echo "$svg: contains <script> or foreignObject"; rc=1; } || true
          done < <(find . -name '*.svg' -not -path './.git/*' -print0)
          exit $rc

  go-build:
    name: Go build (if present)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build modules
        run: |
          mapfile -t mods < <(find . -name go.mod -not -path './vendor/*' -not -path './Ref/*' | head -10)
          if [ ${#mods[@]} -eq 0 ]; then
            echo "No go.mod"
          else
            for m in "${mods[@]}"; do
              dir=$(dirname "$m")
              (cd "$dir" && go build ./...)
            done
          fi
