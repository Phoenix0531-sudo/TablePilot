name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: ${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/uv.lock') != '' && 'pip' || '' }}
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            **/uv.lock
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          while IFS= read -r f; do pip install -r "$f" || true; done < <(find . -maxdepth 3 -name 'requirements*.txt' -not -path './.venv/*' | head -8)
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e . || true; fi
          pip install pytest
      - name: Required files
        run: |
          test -f README.md
          test -f LICENSE || test -f LICENSE.md
      - name: Pytest (tests/ only, hard)
        run: |
          set -e
          if [ -d tests ]; then python -m pytest -q tests
          else echo "No tests/ — structure OK"; fi

          if [ -d analysis_service/tests ]; then
            pip install -r analysis_service/requirements.txt 2>/dev/null || true
            python -m pytest -q analysis_service/tests
          fi


  readme-audit:
    name: README links & SVG audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Audit local image and link targets
        run: |
          set -e
          rc=0
          for f in README.md README.zh-CN.md; do
            [ -f "$f" ] || { echo "missing $f"; rc=1; continue; }
            # local targets inside markdown image syntax and <img src=...>
            grep -oE '!\[[^]]*]\(([^) #]+)(?: [^)]*)?\)' "$f" \
              | sed -E 's/.*\(([^) #]+).*/\1/' \
              | grep -vE '^(https?:|data:|#)' | sort -u | while read -r img; do
                [ -f "$img" ] || { echo "$f: missing image $img"; rc=1; }
              done
            grep -oE 'src="([^"]+)"' "$f" \
              | sed -E 's/src="([^"]+)"/\1/' \
              | grep -vE '^(https?:|data:|#)' | sort -u | while read -r img; do
                [ -f "$img" ] || { echo "$f: missing img src $img"; rc=1; }
              done
          done
          # SVG basics: every *.svg must have viewBox + <title>, no <script> / foreignObject
          while IFS= read -r -d '' svg; do
            grep -q 'viewBox'    "$svg" || { echo "$svg: missing viewBox";    rc=1; }
            grep -q '<title'     "$svg" || { echo "$svg: missing <title>";   rc=1; }
            grep -qE '<script|foreignObject' "$svg" \
              && { echo "$svg: contains <script> or foreignObject"; rc=1; } || true
          done < <(find . -name '*.svg' -not -path './.git/*' -print0)
          exit $rc

  ruff-lint:
    name: Ruff lint (analysis_service)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff==0.6.9"
      - name: ruff check
        working-directory: analysis_service
        run: ruff check .

  openapi-export:
    name: OpenAPI snapshot (contract guard)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install analysis_service deps
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis_service/requirements.txt
      - name: Dump openapi.json
        run: python scripts/dump_openapi.py
      - name: Validate schema shape
        run: |
          import json, sys
          with open("docs/openapi.json", encoding="utf-8") as f:
              s = json.load(f)
          paths = sorted(s.get("paths", {}).keys())
          assert s["openapi"].startswith("3."), f"unexpected openapi version: {s['openapi']}"
          assert s["info"]["title"] == "TablePilot Analysis Service", s["info"]["title"]
          assert s["info"]["version"] == "0.5.0", s["info"]["version"]
          expected = sorted([
              "/health",
              "/api/datasets",
              "/api/analyze",
              "/api/analyze-upload",
              "/api/clean-upload",
              "/api/clean-preview-upload",
              "/api/agent/query",
              "/api/report/markdown",
              "/api/report/html",
              "/api/session/export",
          ])
          assert paths == expected, f"path set mismatch.\nexpected: {expected}\nactual:   {paths}"
          # 10 HTTP operations: one method per path in analysis_service/app/main.py
          ops = sum(len(v) for v in s["paths"].values())
          assert ops == 10, f"expected 10 operations, got {ops}"
          print(f"OK: {len(paths)} paths, {ops} operations, openapi {s['openapi']}")
        shell: python
      - name: Upload snapshot
        uses: actions/upload-artifact@v7
        with:
          name: openapi-json
          path: docs/openapi.json
          if-no-files-found: error

  assets-render:
    name: SVG -> PNG fallback (contract guard)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install cairosvg
        run: |
          python -m pip install --upgrade pip
          pip install cairosvg
      - name: Render PNGs
        run: python scripts/render_assets.py
      - name: Validate PNG size & dimensions
        run: |
          import struct, sys
          from pathlib import Path
          expected = {
              "docs/screenshots/banner.png": (1200, 280),
              "docs/screenshots/banner@2x.png": (2400, 560),
              "docs/screenshots/avatar.png": (256, 256),
              "docs/screenshots/avatar@2x.png": (512, 512),
          }
          for rel, (w, h) in expected.items():
              p = Path(rel)
              assert p.exists() and p.stat().st_size > 0, f"missing/empty {rel}"
              data = p.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", f"{rel}: not a PNG"
              # IHDR width/height are big-endian uint32 at offset 16/20
              iw, ih = struct.unpack(">II", data[16:24])
              assert (iw, ih) == (w, h), f"{rel}: expected {w}x{h}, got {iw}x{ih}"
              print(f"OK: {rel} {iw}x{ih} ({len(data)} bytes)")
        shell: python
      - name: Upload PNGs
        uses: actions/upload-artifact@v7
        with:
          name: png-fallbacks
          path: docs/screenshots/*.png
          if-no-files-found: error

  go-build:
    name: Go build (if present)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Build modules
        run: |
          mapfile -t mods < <(find . -name go.mod -not -path './vendor/*' -not -path './Ref/*' | head -10)
          if [ ${#mods[@]} -eq 0 ]; then
            echo "No go.mod"
          else
            for m in "${mods[@]}"; do
              dir=$(dirname "$m")
              (cd "$dir" && go build ./...)
            done
          fi
