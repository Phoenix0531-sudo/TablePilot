name: CI

on:
  push:
    branches:
      - main
      - modern-ai-analysis-workbench
      - master
  pull_request:

jobs:
  analysis-service:
    name: Analysis service tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r analysis_service/requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/analysis_service
        run: python -m pytest -q analysis_service/tests

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build analysis service image
        run: docker compose build

  package-metadata:
    name: Python package metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate package metadata
        working-directory: analysis_service
        run: python -m pip install -e ".[dev]"
