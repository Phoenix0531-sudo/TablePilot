name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: ${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/uv.lock') != '' && 'pip' || '' }}
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            **/uv.lock
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          while IFS= read -r f; do pip install -r "$f" || true; done < <(find . -maxdepth 3 -name 'requirements*.txt' -not -path './.venv/*' | head -8)
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e . || true; fi
          pip install pytest
      - name: Required files
        run: |
          test -f README.md
          test -f LICENSE || test -f LICENSE.md
      - name: Pytest (tests/ only, hard)
        run: |
          set -e
          if [ -d tests ]; then python -m pytest -q tests
          else echo "No tests/ — structure OK"; fi

          if [ -d analysis_service/tests ]; then
            pip install -r analysis_service/requirements.txt 2>/dev/null || true
            python -m pytest -q analysis_service/tests
          fi


  readme-audit:
    name: README links & SVG audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Audit local image and link targets
        run: |
          set -e
          rc=0
          for f in README.md README.zh-CN.md; do
            [ -f "$f" ] || { echo "missing $f"; rc=1; continue; }
            # local targets inside markdown image syntax and <img src=...>
            grep -oE '!\[[^]]*]\(([^) #]+)(?: [^)]*)?\)' "$f" \
              | sed -E 's/.*\(([^) #]+).*/\1/' \
              | grep -vE '^(https?:|data:|#)' | sort -u | while read -r img; do
                [ -f "$img" ] || { echo "$f: missing image $img"; rc=1; }
              done
            grep -oE 'src="([^"]+)"' "$f" \
              | sed -E 's/src="([^"]+)"/\1/' \
              | grep -vE '^(https?:|data:|#)' | sort -u | while read -r img; do
                [ -f "$img" ] || { echo "$f: missing img src $img"; rc=1; }
              done
          done
          # SVG basics: every *.svg must have viewBox + <title>, no <script> / foreignObject
          while IFS= read -r -d '' svg; do
            grep -q 'viewBox'    "$svg" || { echo "$svg: missing viewBox";    rc=1; }
            grep -q '<title'     "$svg" || { echo "$svg: missing <title>";   rc=1; }
            grep -qE '<script|foreignObject' "$svg" \
              && { echo "$svg: contains <script> or foreignObject"; rc=1; } || true
          done < <(find . -name '*.svg' -not -path './.git/*' -print0)
          exit $rc

  ruff-lint:
    name: Ruff lint (analysis_service)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff==0.6.9"
      - name: ruff check
        working-directory: analysis_service
        run: ruff check .

  ruff-lint-root:
    name: Ruff lint (scripts + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff==0.6.9"
      - name: ruff check (root config)
        run: ruff check scripts tests

  package-metadata:
    name: pyproject dynamic deps resolve
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build backend
        run: python -m pip install --upgrade pip "setuptools>=69" wheel build
      - name: Resolve dynamic dependencies from requirements.txt
        # pyproject.toml now reads [project].dependencies dynamically from
        # requirements.txt. If that wiring ever breaks (file rename, syntax),
        # `pip install analysis_service/` would resolve wrong versions or fail
        # with a cryptic message. This step parses the metadata up front so the
        # build fails loudly at the contract, not at install time.
        working-directory: analysis_service
        run: |
          python -m build --wheel --no-isolation --outdir /tmp/whl >/tmp/build.log 2>&1 || { cat /tmp/build.log; exit 1; }
          python - <<'PY'
          import glob, zipfile, re
          whl = glob.glob('/tmp/whl/*.whl')[0]
          z = zipfile.ZipFile(whl)
          # Wheel metadata lives at {dist}-{ver}.dist-info/METADATA, not root.
          meta_name = next(n for n in z.namelist() if n.endswith('.dist-info/METADATA'))
          md = z.read(meta_name).decode()
          reqs = re.findall(r'^Requires-Dist:\s*(.+)$', md, re.M)
          expected = {'fastapi', 'uvicorn', 'pandas', 'openpyxl', 'xlrd', 'python-multipart'}
          got = {r.split('==')[0].strip().split('[')[0] for r in reqs}
          missing = expected - got
          assert not missing, f"dynamic deps missing from wheel METADATA: {missing}"
          print(f"wheel METADATA carries {len(reqs)} Requires-Dist entries: {sorted(got)}")
          PY

  openapi-export:
    name: OpenAPI snapshot (contract guard)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install analysis_service deps
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis_service/requirements.txt
      - name: Dump openapi.json
        run: python scripts/dump_openapi.py
      - name: Validate schema shape
        run: |
          import json, sys
          with open("docs/openapi.json", encoding="utf-8") as f:
              s = json.load(f)
          paths = sorted(s.get("paths", {}).keys())
          assert s["openapi"].startswith("3."), f"unexpected openapi version: {s['openapi']}"
          assert s["info"]["title"] == "TablePilot Analysis Service", s["info"]["title"]
          assert s["info"]["version"] == "0.5.0", s["info"]["version"]
          expected = sorted([
              "/health",
              "/api/datasets",
              "/api/analyze",
              "/api/analyze-upload",
              "/api/clean-upload",
              "/api/clean-preview-upload",
              "/api/agent/query",
              "/api/report/markdown",
              "/api/report/html",
              "/api/session/export",
          ])
          assert paths == expected, f"path set mismatch.\nexpected: {expected}\nactual:   {paths}"
          # 10 HTTP operations: one method per path in analysis_service/app/main.py
          ops = sum(len(v) for v in s["paths"].values())
          assert ops == 10, f"expected 10 operations, got {ops}"
          print(f"OK: {len(paths)} paths, {ops} operations, openapi {s['openapi']}")
        shell: python
      - name: Endpoint coverage threshold (routes == openapi)
        run: |
          import json, re
          from pathlib import Path
          # Count route decorators actually declared in app/main.py (the source
          # of truth for the API surface). If someone adds/removes an endpoint
          # but forgets to regenerate docs/openapi.json, this drift check fails
          # even when the curated expected list in the Validate step above is
          # kept in sync by hand.
          src = Path("analysis_service/app/main.py").read_text(encoding="utf-8")
          routes = re.findall(r'@app\.(get|post|put|delete|patch)\(', src)
          n_routes = len(routes)
          assert n_routes > 0, "no route decorators found in app/main.py — regex broken?"
          with open("docs/openapi.json", encoding="utf-8") as f:
              spec = json.load(f)
          paths = spec.get("paths", {})
          n_paths = len(paths)
          n_ops = sum(len(v) for v in paths.values())
          assert n_paths == n_routes, (
              f"openapi path count ({n_paths}) != route decorator count ({n_routes}) "
              f"— an endpoint was added/removed in app/main.py but docs/openapi.json "
              f"was not regenerated (run `python scripts/dump_openapi.py`)."
          )
          assert n_ops == n_routes, (
              f"openapi operation count ({n_ops}) != route count ({n_routes}) "
              f"— a path declares !=1 method; review app/main.py."
          )
          print(f"coverage gate OK: {n_paths} paths == {n_routes} routes, {n_ops} ops")
        shell: python
      - name: Upload snapshot
        uses: actions/upload-artifact@v7
        with:
          name: openapi-json
          path: docs/openapi.json
          if-no-files-found: error

  assets-render:
    name: SVG -> PNG fallback (contract guard)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install cairosvg
        run: |
          python -m pip install --upgrade pip
          pip install cairosvg
      - name: Render PNGs
        run: python scripts/render_assets.py
      - name: Validate PNG size & dimensions
        run: |
          import struct, sys
          from pathlib import Path
          expected = {
              "docs/screenshots/banner.png": (1200, 280),
              "docs/screenshots/banner@2x.png": (2400, 560),
              "docs/screenshots/avatar.png": (256, 256),
              "docs/screenshots/avatar@2x.png": (512, 512),
          }
          for rel, (w, h) in expected.items():
              p = Path(rel)
              assert p.exists() and p.stat().st_size > 0, f"missing/empty {rel}"
              data = p.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", f"{rel}: not a PNG"
              # IHDR width/height are big-endian uint32 at offset 16/20
              iw, ih = struct.unpack(">II", data[16:24])
              assert (iw, ih) == (w, h), f"{rel}: expected {w}x{h}, got {iw}x{ih}"
              print(f"OK: {rel} {iw}x{ih} ({len(data)} bytes)")
        shell: python
      - name: Upload PNGs
        uses: actions/upload-artifact@v7
        with:
          name: png-fallbacks
          path: docs/screenshots/*.png
          if-no-files-found: error

  go-build:
    name: Go build (if present)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Build modules
        run: |
          mapfile -t mods < <(find . -name go.mod -not -path './vendor/*' -not -path './Ref/*' | head -10)
          if [ ${#mods[@]} -eq 0 ]; then
            echo "No go.mod"
          else
            for m in "${mods[@]}"; do
              dir=$(dirname "$m")
              (cd "$dir" && go build ./...)
            done
          fi

  demo-e2e:
    name: End-to-end demo script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install service deps
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis_service/requirements.txt
      - name: Start analysis service in background
        working-directory: analysis_service
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          # wait up to 20s for /health
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then echo "service up"; exit 0; fi
            sleep 1
          done
          echo "service did not start"; cat /tmp/uvicorn.log; exit 1
      - name: Run demo script
        run: |
          set -e
          out=$(bash scripts/demo_e2e.sh)
          echo "$out"
          # Assert the demo surfaced real analysis signals, not just HTTP 200s.
          echo "$out" | grep -q 'quality score:'
          echo "$out" | grep -q 'dup rows removed:'
          echo "$out" | grep -q 'anomaly rows marked:'
      - name: Service log on failure
        if: failure()
        run: cat /tmp/uvicorn.log || true

  bench:
    name: Analysis micro-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install service deps
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis_service/requirements.txt
      - name: Run benchmark
        run: |
          python scripts/bench.py | tee /tmp/bench.txt
      - name: Assert positive real numbers
        run: |
          python - <<'PY'
          import re
          out = open("/tmp/bench.txt").read()
          keys = ["profile_demo_ms", "clean_preview_demo_ms",
                  "markdown_report_demo_ms", "profile_synth_ms"]
          for k in keys:
              m = re.search(k + r"=([\d.]+)", out)
              assert m and float(m.group(1)) > 0, f"{k} missing or zero"
          print("all benchmark metrics are positive real numbers")
          PY
