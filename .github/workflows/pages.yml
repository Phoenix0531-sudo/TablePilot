name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Sync screenshots from assets/
        run: |
          set -e
          mkdir -p site/screenshots
          cp -v assets/screenshots/* site/screenshots/
          # Reuse the README hero banner as the site hero too (single source).
          cp -v docs/screenshots/banner.svg site/banner.svg
          cp -v docs/screenshots/avatar.svg site/avatar.svg

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
