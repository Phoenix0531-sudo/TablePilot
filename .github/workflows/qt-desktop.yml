name: Qt desktop build

# Empirically validates that the Qt/C++ desktop shell
# (Statistical_Analysis/Statistical_Analysis.pro) compiles on a clean
# Windows runner — not just on the maintainer's hardcoded local Qt path
# (packaging/build-windows-release.ps1 points at E:\1_Code\QT\6.11.1).
# The README claims "Qt 6.5+"; this job proves the .pro builds under a
# stock Qt 6.8 MSVC 2022 install and surfaces real breakage (removed
# APIs, missing modules, qcustomplot drift) instead of letting the
# desktop shell rot silently.
#
# Why MSVC, not MinGW: Qt 6.8's official MinGW prebuilt entrypoint
# (libQt6EntryPoint.a) still references the MSVCRT-style import symbol
# __imp___argc, which newer MSYS2 mingw-w64 runtimes no longer export;
# compiling under MSYS2 GCC 15 therefore fails at link time. The aqt
# bundled tools_mingw is GCC 8.1 (has the symbol) but trips a
# static_assert in QtCore/qcomparehelpers.h against Qt 6.8 headers.
# MSVC sidesteps the runtime ABI mismatch entirely and matches how Qt's
# own CI ships the win64_msvc2022_64 binaries.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build TablePilot.exe (MSVC, Qt 6.8)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6.8 (MSVC 2022 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          set-env: true

      - name: qmake + nmake (MSVC dev shell via vswhere)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          mkdir build
          cd build
          qmake -spec win32-msvc ..\Statistical_Analysis\Statistical_Analysis.pro "CONFIG+=release"
          nmake release

      - name: Locate & verify TablePilot.exe
        shell: bash
        run: |
          exe="$(find build -name TablePilot.exe -type f | head -1)"
          echo "exe=$exe"
          test -n "$exe"
          ls -la "$exe"

      - name: Upload TablePilot.exe
        uses: actions/upload-artifact@v7
        with:
          name: TablePilot-windows-exe
          path: build/**/TablePilot.exe
          if-no-files-found: error
          retention-days: 14

  release-assets:
    name: Attach TablePilot.exe to the tag release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built exe
        uses: actions/download-artifact@v7
        with:
          name: TablePilot-windows-exe
          path: release-assets

      - name: Attach versioned exe to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # upload-artifact preserved the build/release/ path of the exe,
          # so locate it recursively rather than at the download root.
          exe="$(find release-assets -name TablePilot.exe -type f | head -1)"
          test -n "$exe"
          mv "$exe" "TablePilot-${tag}.exe"
          # Create a draft release for the tag if one does not yet exist;
          # if a release was already published manually, this is a no-op.
          gh release create "$tag" --draft --generate-notes --repo "$GITHUB_REPOSITORY" || true
          gh release upload "$tag" "TablePilot-${tag}.exe" --clobber --repo "$GITHUB_REPOSITORY"
