name: Qt desktop build

# Empirically validates that the Qt/C++ desktop shell
# (Statistical_Analysis/Statistical_Analysis.pro) compiles on a clean
# Windows runner — not just on the maintainer's hardcoded local Qt path
# (packaging/build-windows-release.ps1 points at E:\1_Code\QT\6.11.1).
# The README claims "Qt 6.5+"; this job proves the .pro builds under a
# stock Qt 6.8 MSVC 2022 install and surfaces real breakage (removed
# APIs, missing modules, qcustomplot drift) instead of letting the
# desktop shell rot silently.
#
# Why MSVC, not MinGW: Qt 6.8's official MinGW prebuilt entrypoint
# (libQt6EntryPoint.a) still references the MSVCRT-style import symbol
# __imp___argc, which newer MSYS2 mingw-w64 runtimes no longer export;
# compiling under MSYS2 GCC 15 therefore fails at link time. The aqt
# bundled tools_mingw is GCC 8.1 (has the symbol) but trips a
# static_assert in QtCore/qcomparehelpers.h against Qt 6.8 headers.
# MSVC sidesteps the runtime ABI mismatch entirely and matches how Qt's
# own CI ships the win64_msvc2022_64 binaries.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt-tests:
    # Lightweight: builds only textformat.cpp + test_textformat.cpp against
    # QtCore + QtTest (no QCustomPlot, no UI, no service). Fast feedback on
    # the extracted localization helpers that the desktop shell renders.
    name: QtTest (textformat helpers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6 from the Ubuntu archive (qt6-base-dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            libgl1-mesa-dev \
            libegl1 \
            libxkbcommon0

      - name: qmake6 + make test binary (textformat)
        run: |
          mkdir build-test
          cd build-test
          qmake6 ../Statistical_Analysis/tests/test_textformat.pro "CONFIG+=release"
          make -j$(nproc)

      - name: Run QtTest (textformat)
        run: |
          bin="$(find build-test -name test_textformat -type f | head -1)"
          echo "bin=$bin"
          test -n "$bin"
          QT_QPA_PLATFORM=offscreen "$bin" -v2

      - name: qmake6 + make test binary (exadock parser)
        run: |
          mkdir build-exadock
          cd build-exadock
          qmake6 ../Statistical_Analysis/tests/test_exadock.pro "CONFIG+=release"
          make -j$(nproc)

      - name: Run QtTest (exadock parser)
        run: |
          bin="$(find build-exadock -name test_exadock -type f | head -1)"
          echo "bin=$bin"
          test -n "$bin"
          QT_QPA_PLATFORM=offscreen "$bin" -v2

  build-windows:
    name: Build TablePilot.exe (MSVC, Qt 6.8)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6.8 (MSVC 2022 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          set-env: true

      - name: qmake + nmake (MSVC dev shell via vswhere)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          mkdir build
          cd build
          qmake -spec win32-msvc ..\Statistical_Analysis\Statistical_Analysis.pro "CONFIG+=release"
          nmake release

      - name: Locate & verify TablePilot.exe
        shell: bash
        run: |
          exe="$(find build -name TablePilot.exe -type f | head -1)"
          echo "exe=$exe"
          test -n "$exe"
          ls -la "$exe"

      - name: Smoke launch (offscreen platform, no service)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          exe="$(find build -name TablePilot.exe -type f | head -1)"
          test -n "$exe"
          # Launch the GUI binary headless; it must start the Qt event loop and
          # stay alive for several seconds without an analysis service running
          # (API calls are expected to fail gracefully, not crash the shell).
          # `timeout` sends SIGTERM after 5s -> exit code 124 means the binary
          # was still running (healthy). Exit 0 would mean it self-terminated
          # cleanly within 5s — also acceptable. Any other code is a startup crash.
          timeout 5 "$exe" >/tmp/tp-smoke.log 2>&1
          code=$?
          echo "TablePilot.exe exited with code $code (124 = timed out = healthy, 0 = clean early exit)"
          echo "--- smoke log ---"
          cat /tmp/tp-smoke.log || true
          test "$code" -eq 124 -o "$code" -eq 0

      - name: Upload TablePilot.exe
        uses: actions/upload-artifact@v7
        with:
          name: TablePilot-windows-exe
          path: build/**/TablePilot.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build TablePilot.app (macOS, Qt 6.8)
    # macos-14 ships Xcode 15 with a macOS 14 SDK that still includes the AGL
    # framework stub; macos-latest (26.x SDK) removed AGL, which makes the
    # Qt 6.8 macx-clang mkspec's `-framework AGL` link step fail. Pin to macos-14
    # so the stock Qt 6.8 release links without source changes.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6.8 (macOS clang 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: clang_64
          set-env: true

      - name: qmake + make (clang)
        run: |
          mkdir build
          cd build
          # Qt 6.8.3 headers (qyieldcpu.h __yield) trip -Werror under a newer
          # macOS SDK than Qt 6.8 was tested against; silence that one warning
          # and skip the SDK version gate rather than fight the mkspec.
          qmake ../Statistical_Analysis/Statistical_Analysis.pro \
            "CONFIG+=release" \
            "CONFIG+=sdk_no_version_check" \
            "QMAKE_CXXFLAGS+=-Wno-error=implicit-function-declaration"
          make -j$(sysctl -n hw.ncpu)

      - name: Locate & verify TablePilot.app
        run: |
          app="$(find build -name 'TablePilot.app' -type d | head -1)"
          echo "app=$app"
          test -n "$app"
          ls -la "$app"

      - name: Smoke launch (offscreen platform, no service)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          # macOS app bundle binary lives under Contents/MacOS/TablePilot
          bin="$(find build -name TablePilot -type f -path '*/Contents/MacOS/*' | head -1)"
          test -n "$bin"
          # macOS does not ship GNU `timeout` (and `coreutils`/gtimeout is not
          # installed on the stock runner), so launch in the background, sleep,
          # and check liveness: if still alive after 5s the event loop is
          # healthy (124-like); if it self-exited cleanly (code 0) that's also
          # fine; any other exit code is a startup crash.
          "$bin" >/tmp/tp-smoke.log 2>&1 &
          pid=$!
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            echo "TablePilot still running after 5s (healthy)"
            kill "$pid" 2>/dev/null; wait "$pid" 2>/dev/null
            code=124
          else
            wait "$pid"; code=$?
            echo "TablePilot exited early with code $code"
          fi
          echo "--- smoke log ---"
          cat /tmp/tp-smoke.log || true
          test "$code" -eq 124 -o "$code" -eq 0

      - name: Upload TablePilot.app
        uses: actions/upload-artifact@v7
        with:
          name: TablePilot-macos-app
          path: build/**/TablePilot.app
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build TablePilot (Linux, Qt 6 via apt)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6 from the Ubuntu archive (qt6-base-dev)
        run: |
          # aqt cannot install Qt 6.8.x for Linux desktop (Qt stopped shipping
          # a freely-downloadable gcc_64 offline package after 6.7), so use the
          # distro Qt 6 instead. In Ubuntu 24.04 (noble) there is ONE base dev
          # package — `qt6-base-dev` — which already provides headers for the
          # core/gui/widgets/network/printsupport modules of qtbase; the separate
          # `libqt6{network,printsupport}6-dev` sub-packages do NOT exist, so do
          # not install them (apt would error). Qt 6.7.x is API-compatible with
          # our .pro.
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            libgl1-mesa-dev \
            libegl1 \
            libxkbcommon0

      - name: qmake6 + make (gcc)
        run: |
          mkdir build
          cd build
          qmake6 ../Statistical_Analysis/Statistical_Analysis.pro "CONFIG+=release"
          make -j$(nproc)

      - name: Locate & verify TablePilot binary
        run: |
          bin="$(find build -name TablePilot -type f ! -path '*/Contents/*' | head -1)"
          echo "bin=$bin"
          test -n "$bin"
          ls -la "$bin"

      - name: Smoke launch (offscreen platform, no service)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          bin="$(find build -name TablePilot -type f ! -path '*/Contents/*' | head -1)"
          test -n "$bin"
          timeout 5 "$bin" >/tmp/tp-smoke.log 2>&1
          code=$?
          echo "TablePilot exited with code $code (124 = timed out = healthy, 0 = clean early exit)"
          echo "--- smoke log ---"
          cat /tmp/tp-smoke.log || true
          test "$code" -eq 124 -o "$code" -eq 0

      - name: Upload TablePilot binary
        uses: actions/upload-artifact@v7
        with:
          name: TablePilot-linux-bin
          path: build/**/TablePilot
          if-no-files-found: error
          retention-days: 14

  release-assets:
    name: Attach multi-OS binaries to the tag release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Stage versioned release assets
        run: |
          set -e
          tag="${GITHUB_REF#refs/tags/}"
          mkdir -p staged

          # --- Windows exe ---
          exe="$(find release-assets/TablePilot-windows-exe -name TablePilot.exe -type f | head -1)"
          test -n "$exe"
          cp "$exe" "staged/TablePilot-${tag}.exe"

          # --- macOS app bundle -> zip ---
          # The .app bundle is a directory; zip it so it survives the upload
          # and double-click extraction on macOS. Use -y to store symlinks.
          app="$(find release-assets/TablePilot-macos-app -name 'TablePilot.app' -type d | head -1)"
          test -n "$app"
          (cd "$(dirname "$app")" && zip -r -y "${GITHUB_WORKSPACE}/staged/TablePilot-${tag}-macos.zip" TablePilot.app)

          # --- Linux binary ---
          bin="$(find release-assets/TablePilot-linux-bin -name TablePilot -type f ! -path '*/Contents/*' | head -1)"
          test -n "$bin"
          cp "$bin" "staged/TablePilot-${tag}-linux"

          echo '--- staged assets ---'
          ls -la staged/

      - name: Attach versioned assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Create a draft release for the tag if one does not yet exist;
          # if a release was already published manually, this is a no-op.
          gh release create "$tag" --draft --generate-notes --repo "$GITHUB_REPOSITORY" || true
          gh release upload "$tag" staged/* --clobber --repo "$GITHUB_REPOSITORY"
