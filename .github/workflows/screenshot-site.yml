name: Screenshot site (headless)

# Regenerates the two static Pages-site preview screenshots
# (site/screenshots/pages-desktop.png, pages-mobile.png) using headless
# Chromium via Playwright. Runs on every push to main AND on workflow_dispatch.
#
# Why a workflow and not agent_browser: the agent_browser tool is blocked on
# Windows by the known empty-namespace quoting bug (upstream #131), and a
# CI step is reproducible across machines and leaves no local-tooling
# dependency. The script serves site/ over a local HTTP server (no Pages
# deploy race, no circular dependency on the live site).

on:
  push:
    branches:
      - main
    paths:
      # Only re-shoot when the site itself or the shared assets change, to
      # avoid burning a runner slot on every commit.
      - 'site/**'
      - 'assets/screenshots/**'
      - 'docs/screenshots/banner.svg'
      - 'docs/screenshots/avatar.svg'
      - '.github/workflows/screenshot-site.yml'
      - 'scripts/screenshot_site.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshot-site
  cancel-in-progress: false

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.49.1"
          # playwright install pulls the OS-specific chromium build;
          # --with-deps also installs the libs needed by that build on ubuntu.
          python -m playwright install --with-deps chromium

      - name: Capture screenshots (desktop 1280x800, mobile 390x844)
        run: |
          python scripts/screenshot_site.py

      - name: Detect changed screenshots
        id: diff
        run: |
          set -e
          git add site/screenshots/pages-desktop.png site/screenshots/pages-mobile.png
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No screenshot changes — site visual is stable."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Screenshots changed — committing to main."
          fi

      - name: Commit + push regenerated screenshots
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(screenshots): regenerate Pages site preview (headless chromium)"
          # Retry-aware push: if main moved since checkout, rebase and retry.
          git pull --rebase origin main
          git push origin main
