[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tablepilot-analysis-service"
version = "0.5.0"
description = "FastAPI planner and profiling service for TablePilot."
requires-python = ">=3.11"
# Dependencies are read dynamically from requirements.txt (see
# [tool.setuptools.dynamic] below) so there is a single source of truth and
# the package metadata can never drift from the pinned set that CI/Docker
# actually install. requirements.txt is the live, Dependabot-tended pin.
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.dynamic]
# Single source of truth: analysis_service/requirements.txt is the pinned
# dependency set exercised by Docker and CI; the package metadata reads from
# it so `pip install analysis_service/` resolves the same versions.
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# Conservative starter rule set: catch real bugs and obvious style, not
# nitpicks. Add F (pyflakes) for unused imports/undefined names, E (pycodestyle
# errors), I (isort), UP (pyupgrade modern syntax), B (bugbear), N (naming).
select = ["E", "F", "I", "UP", "B", "N"]
ignore = [
    "E501",   # line too long (handled by formatter, not linter)
    "B008",   # Do not perform function call in argument defaults (FastAPI Depends)
    "N805",   # first-argument-method name (pydantic validators)
    "N818",   # error suffix (we do not suffix exception names with Error)
]

[tool.ruff.lint.per-file-ignores]
# Tests may legitimately use longer lines, unused fixtures, and assert.
"tests/*.py" = ["E402", "F811"]
