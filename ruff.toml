# Ruff configuration for repo-root Python (scripts/ and tests/).
#
# This config is the SECOND ruff scope in the repo. The PRIMARY rule set lives
# in analysis_service/pyproject.toml [tool.ruff]; this file EXTENDS it so the
# whole repo enforces ONE consistent style baseline and the two configs can
# never silently drift (add a rule to pyproject and the root inherits it).
#
# The root job (ruff-lint-root in ci.yml) runs `ruff check scripts tests` with
# this config; the analysis_service job runs `ruff check .` with
# analysis_service/pyproject.toml. The only differences this file adds are the
# excludes (analysis_service/build/dist/Statistical_Analysis/site are out of
# scope here) and per-directory ignores for scripts (E402 for sys.path imports).

# Inherit line-length, target-version, select, ignore, and per-file-ignores
# from the analysis_service config. Only override what differs for the root scope.
extend = "analysis_service/pyproject.toml"

extend-exclude = [
    "analysis_service",       # linted by its own job + config
    "build",
    "dist",
    ".venv",
    "Statistical_Analysis",   # Qt/C++ desktop shell, no Python
    "site",                   # static Pages content
]

[lint.per-file-ignores]
# Inherit the tests/*.py ignores from the parent, then add script-specific
# allowances. ruff merges per-file-ignores on extend.
"tests/*.py" = ["E402", "F811"]
# Scripts legitimately import after sys.path manipulation.
"scripts/*.py" = ["E402"]
